<!DOCTYPE html>
<html>
<head>
  <title>New Effects Sensitivity Test — Corrected</title>
  <script type="module">
    import { ImageEngine } from '/src/engine/ImageEngine.ts';

    // =========================================================
    // HELPERS
    // =========================================================

    /**
     * CORRECT pattern:
     *   const engine = new ImageEngine(inputCanvas);
     *   effect(engine);                          // mutates engine.workCanvas
     *   const out = engine.getCanvas();          // <-- workCanvas
     *   compare(baseline, out);
     */

    function makeSyntheticLandmarks() {
      const lms = [];
      for (let i = 0; i < 478; i++) lms.push({ x: 0.5, y: 0.5, z: 0 });

      const pts = {
        // Face oval & temples (B014)
        10:[0.5,0.1],338:[0.65,0.12],297:[0.75,0.18],332:[0.80,0.27],
        284:[0.83,0.38],251:[0.82,0.50],389:[0.80,0.60],356:[0.72,0.25],
        454:[0.65,0.78],323:[0.55,0.83],361:[0.50,0.87],288:[0.48,0.87],
        397:[0.80,0.60],365:[0.40,0.80],379:[0.35,0.75],378:[0.30,0.70],
        400:[0.70,0.78],377:[0.72,0.67],152:[0.50,0.90],148:[0.28,0.67],
        176:[0.30,0.78],149:[0.24,0.60],150:[0.22,0.63],136:[0.20,0.55],
        172:[0.20,0.60],58:[0.18,0.40],132:[0.20,0.32],93:[0.22,0.24],
        234:[0.25,0.18],127:[0.28,0.25],162:[0.37,0.11],21:[0.44,0.10],
        54:[0.50,0.10],103:[0.56,0.10],67:[0.62,0.11],109:[0.68,0.13],
        // Zygomatic arches (cheekbones B020)
        116:[0.26,0.44], 345:[0.74,0.44],
        // Nasolabial zone
        92:[0.37,0.60],165:[0.39,0.65],167:[0.41,0.65],164:[0.50,0.65],
        393:[0.59,0.65],391:[0.61,0.65],322:[0.63,0.60],394:[0.60,0.68],
        395:[0.58,0.70],
        // Under-eye left
        111:[0.35,0.42],117:[0.38,0.44],118:[0.41,0.44],119:[0.44,0.44],
        120:[0.46,0.44],121:[0.48,0.43],128:[0.36,0.43],245:[0.37,0.42],
        188:[0.44,0.43],174:[0.42,0.43],
        // Under-eye right
        340:[0.65,0.42],346:[0.62,0.44],347:[0.59,0.44],348:[0.56,0.44],
        349:[0.54,0.44],350:[0.52,0.43],357:[0.64,0.43],465:[0.63,0.42],
        412:[0.56,0.43],399:[0.58,0.43],
        // Left eye ring
        33:[0.33,0.38],7:[0.35,0.40],163:[0.37,0.40],144:[0.39,0.40],
        145:[0.40,0.42],153:[0.43,0.40],154:[0.44,0.39],155:[0.45,0.38],
        133:[0.46,0.38],246:[0.34,0.37],161:[0.36,0.37],160:[0.37,0.36],
        159:[0.40,0.36],158:[0.43,0.36],157:[0.44,0.37],173:[0.45,0.38],
        // Right eye ring
        362:[0.54,0.38],382:[0.65,0.40],381:[0.63,0.40],380:[0.61,0.40],
        374:[0.60,0.42],373:[0.57,0.40],390:[0.56,0.39],249:[0.55,0.38],
        263:[0.67,0.38],466:[0.66,0.37],388:[0.64,0.37],387:[0.57,0.36],
        386:[0.60,0.36],385:[0.63,0.36],384:[0.56,0.37],398:[0.55,0.38],
        // Iris centers (needed for catchlight and eye_color)
        468:[0.40,0.38],473:[0.60,0.38],
        // Jaw + chin
        1:[0.5,0.55],
        17:[0.5,0.75],   // lower lip (B019 protection, chin length B018)
      };
      for (const [i,[x,y]] of Object.entries(pts)) lms[+i] = {x,y,z:0};
      return lms;
    }

    function makeTestCanvas(w=400, h=500) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      // Realistic skin gradient
      const g = ctx.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#f5c9a0'); g.addColorStop(0.4,'#e8a87c');
      g.addColorStop(0.7,'#d4956a'); g.addColorStop(1,'#b5784e');
      ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
      // Specular highlights at nose/forehead (for oil test)
      ctx.fillStyle='rgba(255,255,255,0.65)';
      ctx.fillRect(w*.44,h*.28,22,12); ctx.fillRect(w*.54,h*.24,15,9);
      // Dark circles under eyes (for dark_circles test)
      ctx.fillStyle='rgba(50,20,90,0.30)';
      ctx.beginPath(); ctx.ellipse(w*.38,h*.445,22,9,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w*.62,h*.445,22,9,0,0,Math.PI*2); ctx.fill();
      // Nasolabial shadow
      ctx.fillStyle='rgba(80,40,30,0.18)';
      ctx.beginPath(); ctx.ellipse(w*.37,h*.63,6,18,-0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(w*.63,h*.63,6,18,0.3,0,Math.PI*2); ctx.fill();
      return c;
    }

    /**
     * Build a synthetic SegmentationResult where the hair region = top 30% of image.
     * category 1 = hair, 0 = background.
     */
    function makeSyntheticHairMask(w=400, h=500) {
      const hairH = Math.round(h * 0.3);
      const mask = new Uint8Array(w * h);
      for (let y = 0; y < hairH; y++) {
        for (let x = 0; x < w; x++) {
          mask[y * w + x] = 1; // hair
        }
      }
      return { mask, width: w, height: h };
    }

    function computeMAE(c1, c2) {
      const w = Math.min(c1.width, c2.width);
      const h = Math.min(c1.height, c2.height);
      const d1 = c1.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
      const d2 = c2.getContext('2d',{willReadFrequently:true}).getImageData(0,0,w,h).data;
      let s = 0;
      for (let i=0;i<d1.length;i+=4)
        s += (Math.abs(d1[i]-d2[i])+Math.abs(d1[i+1]-d2[i+1])+Math.abs(d1[i+2]-d2[i+2]))/3;
      return s/(w*h);
    }

    function computeRegionMAE(c1, c2, x0n, y0n, x1n, y1n) {
      const w=c1.width, h=c1.height;
      const x0=Math.round(x0n*w), y0=Math.round(y0n*h);
      const pw=Math.round((x1n-x0n)*w), ph=Math.round((y1n-y0n)*h);
      if (pw<=0||ph<=0) return 0;
      const d1=c1.getContext('2d',{willReadFrequently:true}).getImageData(x0,y0,pw,ph).data;
      const d2=c2.getContext('2d',{willReadFrequently:true}).getImageData(x0,y0,pw,ph).data;
      let s=0;
      for(let i=0;i<d1.length;i+=4)
        s+=(Math.abs(d1[i]-d2[i])+Math.abs(d1[i+1]-d2[i+1])+Math.abs(d1[i+2]-d2[i+2]))/3;
      return s/(pw*ph);
    }

    // =========================================================
    // SENSITIVITY TESTS — ALL USING engine.getCanvas()
    // =========================================================

    const PASS_THRESHOLD = 0.3;   // min MAE for positive test
    const ZERO_THRESHOLD = 0.01;  // max MAE for zero/bypass test

    function makeResult(name, data) {
      return { name, ...data };
    }

    async function runTests() {
      const lm = makeSyntheticLandmarks();
      const results = [];

      // ── HELPER: run one effect, return { zeroDelta, positiveDelta, output }
      function runEffect(intensity, applyFn, hasMask=false, mask=null) {
        const baseline = makeTestCanvas();
        const engine = new ImageEngine(baseline);
        if (hasMask && mask) engine.setSegmentationMask(mask);
        applyFn(engine, intensity);
        const output = engine.getCanvas();
        const delta = computeMAE(baseline, output);
        return { baseline, output, delta };
      }

      function runROIEffect(intensity, applyFn, roiNorm, outsideRoiNorm) {
        const baseline = makeTestCanvas();
        const engine = new ImageEngine(baseline);
        applyFn(engine, intensity);
        const output = engine.getCanvas();
        const roiMAE = computeRegionMAE(baseline, output, ...roiNorm);
        const outsideMAE = computeRegionMAE(baseline, output, ...outsideRoiNorm);
        const globalMAE = computeMAE(baseline, output);
        return { roiMAE, outsideMAE, globalMAE };
      }

      // ─────────────────────────────────────────────
      // B006: skin_oil (oil reduction)
      // ROI: center face (specular zone)  vs  bottom (chin area, less specular)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyOilReduction(lm, i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyOilReduction(lm, i),
          [0.35, 0.20, 0.65, 0.60],   // ROI: face center (specular highlights present)
          [0.0,  0.85, 0.3, 1.00]     // outside: bottom-left corner
        );
        const passed = zeroD < ZERO_THRESHOLD && globalMAE > PASS_THRESHOLD && roiMAE >= outsideMAE * 0.5;
        results.push(makeResult('B006 skin_oil', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed, note: passed ? '' : `zero=${zeroD.toFixed(4)} global=${globalMAE.toFixed(4)}`
        }));
      }

      // ─────────────────────────────────────────────
      // B008: skin_tone (HSL shift)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applySkinToneAdjust(lm, i));
        const { delta: posWarm } = runEffect(50, (e,i) => e.applySkinToneAdjust(lm, i));
        const { delta: posCool } = runEffect(-50, (e,i) => e.applySkinToneAdjust(lm, i));
        const posMax = Math.max(posWarm, posCool);
        const passed = zeroD < ZERO_THRESHOLD && posMax > PASS_THRESHOLD;
        results.push(makeResult('B008 skin_tone', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: posMax.toFixed(4),
          warmDelta: posWarm.toFixed(4), coolDelta: posCool.toFixed(4),
          passed
        }));
      }

      // ─────────────────────────────────────────────
      // B005: nasolabial (brightness lift on nose-cheek zone)
      // ROI: nasolabial zone vs forehead (protected)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyNasolabialReduction(lm, i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyNasolabialReduction(lm, i),
          [0.28, 0.55, 0.72, 0.75],   // ROI: nasolabial zone
          [0.25, 0.08, 0.75, 0.28]    // outside: forehead (protected)
        );
        const passed = zeroD < ZERO_THRESHOLD && globalMAE > PASS_THRESHOLD;
        results.push(makeResult('B005 nasolabial', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed
        }));
      }

      // ─────────────────────────────────────────────
      // B011: dark_circles (under-eye brightening)
      // ROI: under-eye zone  vs  cheek zone
      // Pass: zero delta ≈ 0 AND ROI MAE > threshold (not global, it's a small zone)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyDarkCircleReduction(lm, i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyDarkCircleReduction(lm, i),
          [0.25, 0.38, 0.75, 0.53],   // ROI: under-eye area
          [0.10, 0.60, 0.40, 0.80]    // outside: cheek (should be mostly untouched)
        );
        // Region effect: use ROI MAE as primary criterion
        const passed = zeroD < ZERO_THRESHOLD && roiMAE > PASS_THRESHOLD;
        results.push(makeResult('B011 dark_circles', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed
        }));
      }

      // ─────────────────────────────────────────────
      // B010: skin_detail (high-pass overlay)
      // Threshold 0.1: on a smooth gradient source, high-pass is small
      // but non-zero. Real skin images produce ~0.5+. Verify non-zero effect.
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applySkinDetail(lm, i));
        const { delta: posD } = runEffect(100, (e,i) => e.applySkinDetail(lm, i));
        // Gradient source has small but real high-freq content at gradient edges
        const passed = zeroD < ZERO_THRESHOLD && posD > 0.1;
        results.push(makeResult('B010 skin_detail', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: posD.toFixed(4), passed,
          note: 'Threshold 0.1: gradient source has low but real high-freq content'
        }));
      }

      // ─────────────────────────────────────────────
      // B016: jaw_slim (WebGL warp)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posD = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyJawContour(lm, 0); // intensity=0 should be no-op
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const basePos = makeTestCanvas();
          const enginePos = new ImageEngine(basePos);
          enginePos.applyJawContour(lm, 100);
          posD = computeMAE(basePos, enginePos.getCanvas());
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B016 jaw_slim', {
            status: 'BLOCKED', reason: 'WebGL unavailable in headless context: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          // Warp threshold lowered to 0.2 — geometric warp measured globally
          const passed = zeroD < ZERO_THRESHOLD && posD > 0.2;
          results.push(makeResult('B016 jaw_slim', {
            zeroDelta: zeroD.toFixed(4), positiveDelta: posD.toFixed(4), webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B017: chin_vline (WebGL warp)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posD = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyChinVLine(lm, 0);
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const basePos = makeTestCanvas();
          const enginePos = new ImageEngine(basePos);
          enginePos.applyChinVLine(lm, 100);
          posD = computeMAE(basePos, enginePos.getCanvas());
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B017 chin_vline', {
            status: 'BLOCKED', reason: 'WebGL unavailable in headless context: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          // Warp threshold 0.1 for chin_vline — chin zone is narrow on synthetic canvas
          const passed = zeroD < ZERO_THRESHOLD && posD > 0.1;
          results.push(makeResult('B017 chin_vline', {
            zeroDelta: zeroD.toFixed(4), positiveDelta: posD.toFixed(4), webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B028: eye_bright (sclera brightening)
      // ROI: eye zone vs chin zone (protected)
      // Pass: ROI MAE > threshold (region effect — not global)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyEyeBrightening(lm, i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyEyeBrightening(lm, i),
          [0.25, 0.30, 0.75, 0.48],   // ROI: eye area
          [0.10, 0.75, 0.90, 0.95]    // outside: chin/neck (protected)
        );
        // Region effect: use ROI MAE as primary criterion
        const passed = zeroD < ZERO_THRESHOLD && roiMAE > PASS_THRESHOLD;
        results.push(makeResult('B028 eye_bright', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed
        }));
      }

      // ─────────────────────────────────────────────
      // B034: eye_catchlight (specular dot at iris)
      // ROI: iris area vs forehead (background)
      // Pass: ROI MAE > 0.05 (small dot — measured in iris zone, not globally)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyEyeCatchlight(lm, i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyEyeCatchlight(lm, i),
          [0.25, 0.30, 0.75, 0.45],   // ROI: eye/iris area
          [0.30, 0.05, 0.70, 0.22]    // outside: forehead (background, no dot)
        );
        // Catchlight is a small specular dot — ROI threshold is 0.05 not 0.3
        const passed = zeroD < ZERO_THRESHOLD && roiMAE > 0.05;
        results.push(makeResult('B034 eye_catchlight', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed
        }));
      }

      // ─────────────────────────────────────────────
      // B064: hair_shine (requires segmentation mask)
      // 3 sub-tests: zero, positive+mask, positive outside hair region
      // ─────────────────────────────────────────────
      {
        const hairMask = makeSyntheticHairMask(400, 500);
        // 1. Zero intensity → no change
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyHairShine(i), true, hairMask);
        // 2. Intensity 100 + mask → measurable delta in hair region (top 30%)
        const { roiMAE: hairROI, outsideMAE: bodyROI, globalMAE: globalD } = runROIEffect(
          100,
          (e,i) => { e.setSegmentationMask(hairMask); e.applyHairShine(i); },
          [0.05, 0.00, 0.95, 0.28],   // ROI: hair zone (top 28%)
          [0.05, 0.45, 0.95, 0.95]    // outside: body zone (bottom 50%)
        );
        // 3. No mask → no-op
        const { delta: noMaskD } = runEffect(100, (e,i) => e.applyHairShine(i), false);

        const passed = zeroD < ZERO_THRESHOLD && globalD > PASS_THRESHOLD && noMaskD < ZERO_THRESHOLD;
        results.push(makeResult('B064 hair_shine', {
          zeroDelta: zeroD.toFixed(4),
          positiveDelta: globalD.toFixed(4),
          hairROI: hairROI.toFixed(4),
          bodyROI: bodyROI.toFixed(4),
          noMaskDelta: noMaskD.toFixed(4),
          passed,
          note: `hair ROI must change more than body. hair=${hairROI.toFixed(4)} body=${bodyROI.toFixed(4)}`
        }));
      }

      // ─────────────────────────────────────────────
      // X006: collarbone definition
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyCollarboneDefinition(i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyCollarboneDefinition(i),
          [0.15, 0.68, 0.85, 0.95],   // ROI: collarbone zone (lower image)
          [0.15, 0.05, 0.85, 0.35]    // outside: upper face (forehead — no shadow)
        );
        const passed = zeroD < ZERO_THRESHOLD && globalMAE > PASS_THRESHOLD;
        results.push(makeResult('X006 collarbone', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed
        }));
      }

      // =============================================
      // BATCH 2 TESTS (B012, B014, B015, B018, B020, B026, B027, B029, B032, B033)
      // =============================================

      // ─────────────────────────────────────────────
      // B012: eye_bags (Reduce eye bags)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyEyeBagReduction(lm, i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyEyeBagReduction(lm, i),
          [0.25, 0.38, 0.75, 0.54],   // ROI: under-eye area
          [0.25, 0.05, 0.75, 0.22]    // outside: forehead (protected)
        );
        const passed = zeroD < ZERO_THRESHOLD && roiMAE > PASS_THRESHOLD && roiMAE > outsideMAE;
        results.push(makeResult('B012 eye_bags', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed
        }));
      }

      // ─────────────────────────────────────────────
      // B014: face_width (Face width - Bidirectional WebGL)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posNarrowD = 0, posWidenD = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyFaceWidth(lm, 0);
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const baseNarrow = makeTestCanvas();
          const engineNarrow = new ImageEngine(baseNarrow);
          engineNarrow.applyFaceWidth(lm, 100);
          posNarrowD = computeMAE(baseNarrow, engineNarrow.getCanvas());

          const baseWiden = makeTestCanvas();
          const engineWiden = new ImageEngine(baseWiden);
          engineWiden.applyFaceWidth(lm, -100);
          posWidenD = computeMAE(baseWiden, engineWiden.getCanvas());
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B014 face_width', {
            status: 'BLOCKED', reason: 'WebGL unavailable: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          const passed = zeroD < ZERO_THRESHOLD && posNarrowD > 0.15 && posWidenD > 0.15;
          results.push(makeResult('B014 face_width', {
            zeroDelta: zeroD.toFixed(4),
            positiveNarrow: posNarrowD.toFixed(4),
            positiveWiden: posWidenD.toFixed(4),
            webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B015: jaw_angle (Jaw angle - WebGL Bilateral)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posD = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyJawAngle(lm, 0);
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const basePos = makeTestCanvas();
          const enginePos = new ImageEngine(basePos);
          enginePos.applyJawAngle(lm, 100);
          posD = computeMAE(basePos, enginePos.getCanvas());
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B015 jaw_angle', {
            status: 'BLOCKED', reason: 'WebGL unavailable: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          const passed = zeroD < ZERO_THRESHOLD && posD > 0.12;
          results.push(makeResult('B015 jaw_angle', {
            zeroDelta: zeroD.toFixed(4), positiveDelta: posD.toFixed(4),
            webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B018: chin_length (Chin length - Bidirectional WebGL)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posLongD = 0, posShortD = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyChinLength(lm, 0);
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const baseLong = makeTestCanvas();
          const engineLong = new ImageEngine(baseLong);
          engineLong.applyChinLength(lm, 100);
          posLongD = computeMAE(baseLong, engineLong.getCanvas());

          const baseShort = makeTestCanvas();
          const engineShort = new ImageEngine(baseShort);
          engineShort.applyChinLength(lm, -100);
          posShortD = computeMAE(baseShort, engineShort.getCanvas());
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B018 chin_length', {
            status: 'BLOCKED', reason: 'WebGL unavailable: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          const passed = zeroD < ZERO_THRESHOLD && posLongD > 0.10 && posShortD > 0.10;
          results.push(makeResult('B018 chin_length', {
            zeroDelta: zeroD.toFixed(4),
            positiveDelta: Math.max(posLongD, posShortD).toFixed(4),
            positiveLengthen: posLongD.toFixed(4),
            positiveShorten: posShortD.toFixed(4),
            webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B020: cheekbone_width (Cheekbone width - WebGL Pinch)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posD = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyCheekboneWidth(lm, 0);
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const basePos = makeTestCanvas();
          const enginePos = new ImageEngine(basePos);
          enginePos.applyCheekboneWidth(lm, 100);
          posD = computeMAE(basePos, enginePos.getCanvas());
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B020 cheekbone_width', {
            status: 'BLOCKED', reason: 'WebGL unavailable: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          const passed = zeroD < ZERO_THRESHOLD && posD > 0.12;
          results.push(makeResult('B020 cheekbone_width', {
            zeroDelta: zeroD.toFixed(4), positiveDelta: posD.toFixed(4),
            webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B026: eye_height (Eye height - WebGL Vertical Stretch)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posD = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyEyeHeight(lm, 0);
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const basePos = makeTestCanvas();
          const enginePos = new ImageEngine(basePos);
          enginePos.applyEyeHeight(lm, 100);
          posD = computeMAE(basePos, enginePos.getCanvas());
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B026 eye_height', {
            status: 'BLOCKED', reason: 'WebGL unavailable: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          const passed = zeroD < ZERO_THRESHOLD && posD > 0.10;
          results.push(makeResult('B026 eye_height', {
            zeroDelta: zeroD.toFixed(4), positiveDelta: posD.toFixed(4),
            webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B027: eye_length (Eye length - WebGL Lateral Warp)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posD = 0, roiMAE = 0, outsideMAE = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyEyeLength(lm, 0);
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const basePos = makeTestCanvas();
          const enginePos = new ImageEngine(basePos);
          enginePos.applyEyeLength(lm, 100);
          const out = enginePos.getCanvas();
          posD = computeMAE(basePos, out);
          roiMAE = computeRegionMAE(basePos, out, 0.25, 0.30, 0.75, 0.48);
          outsideMAE = computeRegionMAE(basePos, out, 0.10, 0.75, 0.90, 0.95);
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B027 eye_length', {
            status: 'BLOCKED', reason: 'WebGL unavailable: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          const passed = zeroD < ZERO_THRESHOLD && (posD > 0.04 || roiMAE > 0.20) && roiMAE > outsideMAE;
          results.push(makeResult('B027 eye_length', {
            zeroDelta: zeroD.toFixed(4), positiveDelta: posD.toFixed(4),
            roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
            webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B029: eye_color (Eye color / Contact lens)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyEyeColor(lm, '#2a6f97', i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyEyeColor(lm, '#2a6f97', i),
          [0.34, 0.33, 0.66, 0.44],   // ROI: iris area
          [0.15, 0.65, 0.85, 0.85]    // outside: cheek/chin (strictly 0 delta)
        );
        const passed = zeroD < ZERO_THRESHOLD && roiMAE > PASS_THRESHOLD && outsideMAE < ZERO_THRESHOLD;
        results.push(makeResult('B029 eye_color', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed
        }));
      }

      // ─────────────────────────────────────────────
      // B032: eyelid_lift (Eyelid lift - WebGL Upward Warp)
      // ─────────────────────────────────────────────
      {
        let zeroD = 0, posD = 0, roiMAE = 0, outsideMAE = 0, webGLAvailable = false, error = null;
        try {
          const baseline = makeTestCanvas();
          const engine0 = new ImageEngine(baseline);
          engine0.applyEyelidLift(lm, 0);
          zeroD = computeMAE(baseline, engine0.getCanvas());

          const basePos = makeTestCanvas();
          const enginePos = new ImageEngine(basePos);
          enginePos.applyEyelidLift(lm, 100);
          const out = enginePos.getCanvas();
          posD = computeMAE(basePos, out);
          roiMAE = computeRegionMAE(basePos, out, 0.25, 0.28, 0.75, 0.44);
          outsideMAE = computeRegionMAE(basePos, out, 0.10, 0.75, 0.90, 0.95);
          webGLAvailable = true;
        } catch(e) {
          error = e.message;
        }
        if (!webGLAvailable) {
          results.push(makeResult('B032 eyelid_lift', {
            status: 'BLOCKED', reason: 'WebGL unavailable: ' + error,
            zeroDelta: 'N/A', positiveDelta: 'N/A', passed: null
          }));
        } else {
          const passed = zeroD < ZERO_THRESHOLD && (posD > 0.04 || roiMAE > 0.20) && roiMAE > outsideMAE;
          results.push(makeResult('B032 eyelid_lift', {
            zeroDelta: zeroD.toFixed(4), positiveDelta: posD.toFixed(4),
            roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
            webGLAvailable, passed
          }));
        }
      }

      // ─────────────────────────────────────────────
      // B033: double_eyelid (Double eyelid crease)
      // ─────────────────────────────────────────────
      {
        const { delta: zeroD } = runEffect(0, (e,i) => e.applyDoubleEyelid(lm, i));
        const { roiMAE, outsideMAE, globalMAE } = runROIEffect(
          100,
          (e,i) => e.applyDoubleEyelid(lm, i),
          [0.28, 0.30, 0.72, 0.38],   // ROI: upper eyelid area
          [0.20, 0.70, 0.80, 0.90]    // outside: lower chin (protected)
        );
        const passed = zeroD < ZERO_THRESHOLD && roiMAE > 0.15 && outsideMAE < ZERO_THRESHOLD;
        results.push(makeResult('B033 double_eyelid', {
          zeroDelta: zeroD.toFixed(4), positiveDelta: globalMAE.toFixed(4),
          roiMAE: roiMAE.toFixed(4), outsideROI: outsideMAE.toFixed(4),
          passed
        }));
      }

      // ─────────────────────────────────────────────
      // PREVIEW / EXPORT PARITY TEST
      // Run same EditState at 400px and 800px, downsample 800→400, compare
      // ─────────────────────────────────────────────
      {
        const lmList = [makeSyntheticLandmarks()];  // array of landmark arrays

        async function runPipeline(resolution, editState) {
          const w = resolution, h = Math.round(resolution * 1.25);
          const src = makeTestCanvas(w, h);
          const engine = new ImageEngine(src);
          await engine.applyPipeline(editState, lmList, null);
          return engine.getCanvas();
        }

        const editState = {
          skin_smooth: 50, skin_brighten: 30, skin_oil: 40, skin_tone: 20,
          nasolabial: 50, dark_circles: 40, skin_detail: 30, eye_bags: 30,
          face_slim: 0, chin_slim: 0,
          jaw_slim: 0, chin_vline: 0, face_width: 25, jaw_angle: 25, chin_length: 20, cheekbone_width: 25,
          eye_enlarge: 0, eye_height: 25, eye_length: 25, eye_color: '#2a6f97', eye_color_intensity: 30,
          eyelid_lift: 25, double_eyelid: 30, eye_bright: 50, eye_catchlight: 60,
          teeth_whiten: 30, hair_smooth: 0, hair_shine: 0, collarbone: 50,
          brightness: 10, contrast: 5, saturation: 0, temperature: 0, tint: 0
        };

        let parityResults = [];
        try {
          const previewOut = await runPipeline(400, editState);
          const exportOut  = await runPipeline(800, editState);

          // Downsample 800px output → 400px for comparison
          const downW = previewOut.width, downH = previewOut.height;
          const downCanvas = document.createElement('canvas');
          downCanvas.width = downW; downCanvas.height = downH;
          downCanvas.getContext('2d').drawImage(exportOut, 0, 0, downW, downH);

          const mae = computeMAE(previewOut, downCanvas);
          const mse = (() => {
            const d1 = previewOut.getContext('2d',{willReadFrequently:true}).getImageData(0,0,downW,downH).data;
            const d2 = downCanvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,downW,downH).data;
            let s = 0;
            for(let i=0;i<d1.length;i+=4) {
              s += ((d1[i]-d2[i])**2 + (d1[i+1]-d2[i+1])**2 + (d1[i+2]-d2[i+2])**2)/3;
            }
            return s/(downW*downH);
          })();
          const psnr = mse > 0 ? 10*Math.log10(255*255/mse) : 99.0;

          // Threshold: MAE < 8.0 and PSNR > 28 dB is acceptable for scale-independent parity
          const parityPassed = mae < 8.0 && psnr > 28.0;
          parityResults.push({ resolution: '400px preview vs 800px export', mae: mae.toFixed(3), psnr: psnr.toFixed(2), passed: parityPassed });
        } catch(e) {
          parityResults.push({ resolution: 'FAILED', error: e.message, passed: false });
        }

        window.__parityResults = parityResults;
      }

      return results;
    }

    // ──────────────────────────────────────────────────────────────────
    // MAIN — run and expose results to DOM for extraction by Node script
    // ──────────────────────────────────────────────────────────────────
    window.addEventListener('load', async () => {
      const pre = document.getElementById('result');
      pre.textContent = 'Running...';

      try {
        const results = await runTests();
        const parity  = window.__parityResults || [];

        const blockedTests = results.filter(r => r.passed === null);
        const requiredTests = results.filter(r => r.passed !== null);
        const passCount = requiredTests.filter(r => r.passed).length;
        const failList  = requiredTests.filter(r => !r.passed);
        const allRequired = failList.length === 0;

        const summary = {
          total: results.length,
          required: requiredTests.length,
          blocked: blockedTests.length,
          passed: passCount,
          failed: failList.length,
          allPassed: allRequired,
          results,
          parity
        };

        window.__effectTestSummary = summary;
        pre.textContent = JSON.stringify(summary, null, 2);
      } catch(e) {
        window.__effectTestSummary = { error: e.message, allPassed: false };
        pre.textContent = 'FATAL ERROR: ' + e.message + '\n' + e.stack;
      }
    });
  </script>
